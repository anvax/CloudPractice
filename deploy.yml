---
- name: Deploy MySQL on db server
  hosts: db
  become: true

  tasks:
    - name: Install python docker dependency
      apt:
        name: python3-docker
        state: present
        update_cache: yes

    - name: Run MySQL container
      docker_container:
        name: mysql-db
        image: mysql:5.7
        restart_policy: always
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: todo
          MYSQL_USER: todo
          MYSQL_PASSWORD: todopass
        volumes:
          - mysql_data:/var/lib/mysql
        command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password

    - name: Wait for MySQL
      shell: docker exec mysql-db mysqladmin ping -uroot -prootpass --silent
      register: mysql_ready
      retries: 40
      delay: 5
      until: mysql_ready.rc == 0

    - name: Create remote DB user
      shell: |
        docker exec mysql-db mysql -uroot -prootpass -e "
          CREATE USER IF NOT EXISTS 'todo'@'%' IDENTIFIED BY 'todopass';
          GRANT ALL PRIVILEGES ON todo.* TO 'todo'@'%';
          FLUSH PRIVILEGES;
        "
    - name: Create todos table
      shell: |
        docker exec mysql-db mysql -uroot -prootpass todo -e "
          CREATE TABLE IF NOT EXISTS todos (
            id INT AUTO_INCREMENT PRIMARY KEY,
            task VARCHAR(255) NOT NULL,
            completed BOOLEAN DEFAULT FALSE,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
        "


- name: Deploy Todo App on app server
  hosts: app
  become: true

  tasks:
    - name: Install docker-compose
      apt:
        name: docker-compose
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /opt/todo
        state: directory

    - name: Create package.json
      copy:
        dest: /opt/todo/package.json
        content: |
          {
            "name": "todo-app",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.2",
              "mysql2": "^3.6.0"
            }
          }

    - name: Create index.js
      copy:
        dest: /opt/todo/index.js
        content: |
          const express = require('express');
          const mysql = require('mysql2');
          const app = express();

          app.use(express.json());

          const pool = mysql.createPool({
            host: process.env.MYSQL_HOST,
            user: process.env.MYSQL_USER,
            password: process.env.MYSQL_PASSWORD,
            database: process.env.MYSQL_DATABASE,
            waitForConnections: true,
            connectionLimit: 10
          });

          app.get('/', (req, res) => {
          res.send(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Todo App</title>
            </head>
            <body>
              <h1>📝 Todo App</h1>

              <input id="task" placeholder="new task">
              <button onclick="add()">Add</button>

              <div id="list"></div>

              <script>
                async function load() {
                  const res = await fetch('/todos');
                  const data = await res.json();
                  document.getElementById('list').innerHTML =
                    data.map(t => '<p>' + t.task + '</p>').join('');
                }

                async function add() {
                  const task = document.getElementById('task').value;
                  await fetch('/todos', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({task})
                  });
                  load();
                }

                load();
              </script>
            </body>
            </html>
          `);
          });

          app.get('/todos', async (req, res) => {
            const [rows] = await pool.promise().query('SELECT * FROM todos');
            res.json(rows);
          });

          app.post('/todos', async (req, res) => {
            const [r] = await pool.promise().query(
              'INSERT INTO todos (task) VALUES (?)',
              [req.body.task]
            );
            res.json({id: r.insertId});
          });

          app.listen(3000, () => console.log('App running'));

    - name: Create Dockerfile
      copy:
        dest: /opt/todo/Dockerfile
        content: |
          FROM node:18-alpine
          WORKDIR /app
          COPY package.json .
          RUN npm install
          COPY index.js .
          EXPOSE 3000
          CMD ["node", "index.js"]

    - name: Create docker-compose
      copy:
        dest: /opt/todo/docker-compose.yml
        content: |
          version: '3.8'

          services:
            todo-app:
              build: .
              container_name: todo-app
              restart: always
              ports:
                - "80:3000"
              environment:
                MYSQL_HOST: 192.168.23.1
                MYSQL_USER: todo
                MYSQL_PASSWORD: todopass
                MYSQL_DATABASE: todo

    - name: Build and run app
      shell: |
        cd /opt/todo
        docker-compose down || true
        docker-compose build
        docker-compose up -d